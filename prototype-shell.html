<title>Review Intelligence Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Deliberately single-theme: this is a greyscale wireframe prototype, so it
     paints its own light ground explicitly rather than following the viewer. */
  :root{color-scheme:light;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:#f7f7f6;color:#4b4d52;font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:#a8512c;}
  a:hover{color:#8a4023;}
  :focus-visible{outline:2px solid #a8512c;outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}

  /* ---------- login ---------- */
  #login{min-height:100%;display:flex;background:#fff;}
  .login-left{width:44%;min-width:380px;flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:40px 48px;border-right:1px solid #dcdde0;}
  .login-right{flex:1;min-width:0;background:#f7f7f6;padding:40px 44px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;}
  @media (max-width:900px){#login{flex-direction:column;}.login-left{width:auto;min-width:0;border-right:0;border-bottom:1px solid #dcdde0;}}
  .lbl{font:600 10px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#5f6268;}
  .fld{border:1px solid #c9cbcf;border-radius:3px;background:#fff;padding:0 13px;min-height:46px;display:flex;align-items:center;gap:10px;font:400 13px/1.3 'IBM Plex Sans',sans-serif;color:#17181a;width:100%;text-align:left;}
  .fld-ph{color:#8a8d93;}
  .wsel{display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:2px;background:#fff;width:100%;text-align:left;cursor:pointer;font:inherit;}
  .wsel:hover{background:#f2f2f3;}
  .wsel[aria-pressed="true"]{background:#17181a;}
  .wsel[aria-pressed="true"] .tdk,.wsel[aria-pressed="true"] .td{color:#fff;}
  .wsel[aria-pressed="true"] .tag{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #dcdde0;background:#fff;border-radius:3px;min-height:46px;font:500 13px/1 'IBM Plex Sans',sans-serif;color:#17181a;width:100%;cursor:pointer;}
  .bigbtn:hover{background:#f2f2f3;}
  .bigbtn-p{background:#17181a;border-color:#17181a;color:#fff;font-weight:600;}
  .bigbtn-p:hover{background:#2f3135;}
  .bigbtn[disabled]{opacity:.45;cursor:not-allowed;}

  /* ---------- app shell ---------- */
  #app{display:flex;height:100%;overflow:hidden;}
  #side{width:236px;flex:none;background:#fff;border-right:1px solid #dcdde0;display:flex;flex-direction:column;overflow-y:auto;}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #head{min-height:54px;flex:none;background:#fff;border-bottom:1px solid #dcdde0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 22px;flex-wrap:wrap;}
  #scroll{flex:1;overflow:auto;}
  #view{padding:20px 22px 28px;display:flex;flex-direction:column;gap:13px;min-width:1040px;}
  @media (max-width:820px){#side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .16s ease;box-shadow:0 0 40px rgba(23,24,26,.18);}
    #side.open{transform:none;}#burger{display:flex!important;}}
  #burger{display:none;}
  .nav{width:100%;border:0;background:transparent;cursor:pointer;font:500 12.5px/1.3 'IBM Plex Sans',sans-serif;text-align:left;}
  .nav:hover{background:#f2f2f3;}
  .nav-on,.nav-on:hover{background:#17181a;color:#fff;}
  /* Square icon placeholders read as unchecked checkboxes once the page is
     clickable, so the nav uses a round marker instead. */
  #nav .ico{border-radius:50%;width:9px;height:9px;}
  .nav-on .ico{background:currentColor;opacity:.95;}
  [data-signout]{white-space:nowrap;}
  .crumb{display:flex;align-items:center;gap:8px;font:400 12px/1.3 'IBM Plex Sans',sans-serif;color:#6f7278;flex-wrap:wrap;}
  .crumb b{color:#17181a;font-weight:600;}

  /* ---------- interaction affordances ---------- */
  .btn,.chip,.tab,.facet,.box,.th{cursor:pointer;}
  .btn:hover,.chip:hover{background:#f2f2f3;}
  .btn-p:hover{background:#2f3135;}
  .chip-on{background:#17181a!important;border-color:#17181a!important;color:#fff!important;}
  .chip-on .tag{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff;}
  .tab:hover{color:#17181a;}
  .facet:hover .box{border-color:#17181a;}
  .th[data-sortable]:hover{color:#17181a;text-decoration:underline;text-underline-offset:3px;}
  .th[data-sortable]::after{content:" ⇅";opacity:.4;}
  .drill{cursor:pointer;}
  .drill:hover{background:#f7f7f6;}
  .hidden{display:none!important;}

  /* ---------- prototype chrome ---------- */
  #hint{display:flex;align-items:flex-start;gap:10px;background:#fdf9f7;border:1px dashed #e3cbbd;border-radius:3px;padding:10px 12px;}
  #hint p{margin:0;font:400 11.5px/1.5 'IBM Plex Sans',sans-serif;color:#a8512c;}
  #hint button{margin-left:auto;flex:none;border:1px solid #e3cbbd;background:#fff;color:#a8512c;border-radius:2px;padding:5px 9px;font:500 10.5px/1 'IBM Plex Sans',sans-serif;cursor:pointer;}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:#17181a;color:#fff;padding:11px 16px;border-radius:3px;font:500 12px/1 'IBM Plex Sans',sans-serif;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;z-index:40;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .empty{background:#fff;border:1px solid #dcdde0;border-radius:3px;padding:40px 32px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
  .empty h2{margin:0;font:600 18px/1.2 'IBM Plex Sans',sans-serif;color:#17181a;letter-spacing:-.015em;}
  .empty p{margin:0;font:400 13px/1.55 'IBM Plex Sans',sans-serif;color:#4b4d52;max-width:58ch;}
</style>

<div id="login"></div>
<div id="app" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>/*__PAGES__*/</script>
<script>
(function () {
  "use strict";

  /* ============ tenant configuration ============
     This is the config bundle the login step resolves. Everything the shell
     renders — nav, page set, branding, breadcrumb — reads from here. */
  var TENANTS = {
    titan: {
      name: "Titan Company", type: "STORE_BASED", typeLabel: "Store-based · IN",
      user: "R. Iyer", role: "Regional Mgr · South", initials: "TC",
      groups: [
        { label: "Monitor", items: [["overview","Overview"],["reviews","Reviews Feed"],["insights","Insights"]] },
        { label: "Network", flag: "Store only", items: [["stores","Store Performance"],["geography","City & Region"]] },
        { label: "Experience", items: [["productservice","Product & Service"],["staff","Staff & Service Quality"],["fulfilment","Delivery & Fulfilment"],["support","Support & Resolution"],["competition","Competitor & Trust"]] },
        { label: "Operate", items: [["actions","Actions & Workflows"],["reports","Reports"]] },
        { label: "Platform", items: [["data","Data Hub"]] }
      ]
    },
    northline: {
      name: "Northline Fintech", type: "NON_STORE", typeLabel: "Non-store · IN",
      user: "J. Bhatt", role: "Head of CX", initials: "NF",
      groups: [
        { label: "Monitor", items: [["ns-overview","Overview"],["reviews","Reviews Feed"],["insights","Insights"]] },
        { label: "Portfolio", flag: "Non-store", items: [["ns-products","Product & App"],["ns-channels","Channel Performance"],["ns-segments","Segments & Cohorts"],["ns-journey","Journey Stages"]] },
        { label: "Experience", items: [["ns-onboarding","Onboarding & Activation"],["ns-billing","Plans & Billing"],["support","Support & Resolution"],["competition","Competitor & Trust"]] },
        { label: "Operate", items: [["actions","Actions & Workflows"],["reports","Reports"]] },
        { label: "Platform", items: [["data","Data Hub"]] }
      ]
    }
  };

  var TITLES = {
    overview:"Overview", "ns-overview":"Overview", reviews:"Reviews Feed", insights:"Insights",
    stores:"Store Performance", geography:"City & Region", productservice:"Product & Service",
    staff:"Staff & Service Quality", fulfilment:"Delivery & Fulfilment", support:"Support & Resolution",
    competition:"Competitor & Trust", actions:"Actions & Workflows", reports:"Reports", data:"Data Hub",
    "ns-products":"Product & App", "ns-channels":"Channel Performance", "ns-segments":"Segments & Cohorts",
    "ns-journey":"Journey Stages", "ns-onboarding":"Onboarding & Activation", "ns-billing":"Plans & Billing"
  };

  /* Header actions per page. */
  var ACTIONS = {
    reviews: ["Save view","Export"], insights: ["Subscribe","Export"],
    data: ["Run now","Add source"], actions: ["Routing rules","New action"],
    reports: ["Template editor","New report"], competition: ["Manage competitor list","Export"],
    "ns-journey": ["Stage model","Export"]
  };

  /* Pages that exist only for one company type — used for the 404 demo. */
  var STORE_ONLY = { stores:1, geography:1, staff:1 };

  /* Links inside the wireframe markup, matched on their text, become routes. */
  var LINK_ROUTES = [
    [/open data hub/i, "data"], [/open store performance/i, "stores"],
    [/open product\s*&\s*app/i, "ns-products"], [/open coverage report/i, "data"],
    [/open mapping tool/i, "data"], [/manage taxonomy/i, "data"], [/view field mapping/i, "data"],
    [/re-authenticate/i, "data"], [/full log/i, "data"],
    [/evidence/i, "reviews"], [/open all/i, "reviews"], [/open feed/i, "reviews"],
    [/open source record/i, "reviews"], [/reviews feed/i, "reviews"],
    [/open route detail/i, "fulfilment"], [/snapshot archive/i, "reports"],
    [/insight:/i, "insights"], [/report:/i, "reports"]
  ];

  var state = { tenant: null, page: null };
  var el = { login: document.getElementById("login"), app: document.getElementById("app"), toast: document.getElementById("toast") };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]; }); }
  /* Browser storage can throw (private window, blocked site data) and is only
     used for a dismissible hint, so failing silently is the correct behaviour. */
  function store(k, v) {
    try {
      if (v === undefined) { return localStorage.getItem(k); }
      localStorage.setItem(k, v);
      return v;
    } catch (e) {
      return null;
    }
  }

  var toastTimer;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove("show"); }, 2200);
  }

  /* ============ page styles ============ */
  var st = document.createElement("style");
  st.textContent = window.PAGE_CSS || "";
  document.head.appendChild(st);

  /* ============ login ============ */
  function renderLogin() {
    var picked = state.pending || null;
    var rows = [
      ["titan", "Titan Company", "Store-based"],
      ["northline", "Northline Fintech", "Non-store"]
    ];
    el.login.innerHTML =
      '<div class="login-left">' +
        '<div style="display:flex;align-items:center;gap:11px;">' +
          '<div style="width:30px;height:30px;border:1px solid #dcdde0;border-radius:3px;background:#f2f2f3;display:grid;place-items:center;"><span class="cap">CX</span></div>' +
          '<span style="font:600 14px/1 \'IBM Plex Sans\',sans-serif;color:#17181a;">Review Intelligence Platform</span>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:22px;max-width:440px;margin:28px 0;">' +
          '<div style="display:flex;flex-direction:column;gap:7px;">' +
            '<h1 style="margin:0;font:600 26px/1.15 \'IBM Plex Sans\',sans-serif;letter-spacing:-.025em;color:#17181a;">Sign in to your workspace</h1>' +
            '<span class="sub">Choose the company you are signing in to. This is the only place a workspace is selected — it cannot be changed from inside the dashboard.</span>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;"><span class="lbl">Step 1 — Company / workspace</span><span class="tag tag-c">Tenant boundary</span></div>' +
            '<div class="pnl" style="padding:5px;display:flex;flex-direction:column;" role="group" aria-label="Choose a workspace">' +
              rows.map(function (r) {
                var on = picked === r[0];
                return '<button type="button" class="wsel" data-pick="' + r[0] + '" aria-pressed="' + on + '">' +
                  '<span style="width:24px;height:24px;flex:none;border:1px solid ' + (on ? "rgba(255,255,255,.3)" : "#dcdde0") + ';border-radius:2px;background:' + (on ? "rgba(255,255,255,.12)" : "#fff") + ';"></span>' +
                  '<span class="tdk" style="flex:1;">' + esc(r[1]) + '</span><span class="tag">' + esc(r[2]) + '</span></button>';
              }).join("") +
              '<div style="padding:8px 10px;border-top:1px solid #ececed;"><span class="foot">Only workspaces your identity is provisioned for are listed</span></div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:9px;">' +
            '<span class="lbl">Step 2 — Sign in</span>' +
            '<button type="button" class="bigbtn" style="justify-content:flex-start;padding:0 14px;gap:10px;" data-sso="1"' + (picked ? "" : " disabled") + '>' +
              '<span style="width:17px;height:17px;border:1.3px solid #6f7278;border-radius:3px;"></span>' +
              'Continue with ' + esc(picked ? TENANTS[picked].name : "company") + ' SSO (SAML)</button>' +
            '<div style="display:flex;align-items:center;gap:12px;"><div style="flex:1;height:1px;background:#ececed;"></div><span class="foot">or</span><div style="flex:1;height:1px;background:#ececed;"></div></div>' +
            '<label class="fld"><span class="fld-ph" style="flex:none;">Work email</span><input id="email" type="email" value="' + esc(userEmail()) + '" style="flex:1;border:0;outline:0;font:inherit;color:#17181a;background:transparent;min-width:0;"></label>' +
            '<label class="fld"><span class="fld-ph" style="flex:none;">Password</span><input id="pwd" type="password" value="prototype" style="flex:1;border:0;outline:0;font:inherit;color:#17181a;background:transparent;min-width:0;"></label>' +
            '<button type="button" class="bigbtn bigbtn-p" data-signin="1"' + (picked ? "" : " disabled") + '>' +
              (picked ? "Sign in to " + esc(TENANTS[picked].name) : "Select a workspace to continue") + '</button>' +
            '<span class="foot">' + (picked ? "Credentials are not checked — this is a prototype." : "Pick a workspace above.") + '</span>' +
          '</div>' +
        '</div>' +
        '<span class="foot">Single-tenant session · SOC2 · Data residency: IN</span>' +
      '</div>' +
      '<div class="login-right">' +
        '<div style="display:flex;flex-direction:column;gap:5px;">' +
          '<div style="display:flex;align-items:center;gap:8px;"><span class="h">What the platform loads on sign-in</span><span class="tag tag-c">Annotation — not UI</span></div>' +
          '<span class="sub">The selected workspace resolves a tenant configuration bundle. Nothing below is user-selectable inside the dashboard.</span>' +
        '</div>' +
        resolvedPanel(picked) +
        '<div class="pnl" style="padding:15px 16px;display:flex;flex-direction:column;gap:12px;border-color:#e3cbbd;background:#fdf9f7;">' +
          '<span class="h" style="color:#a8512c;">Company type decides the page set</span>' +
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;">' +
            '<div style="display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid #e3cbbd;border-radius:3px;padding:12px;">' +
              '<span class="cap" style="color:#a8512c;">Store-based</span>' +
              '<span class="td">Store Performance</span><span class="td">City &amp; Region Performance</span><span class="td">Staff &amp; Service Quality</span>' +
              '<div style="height:1px;background:#f0e6e0;"></div><span class="foot">Also gets product / channel / segment modules</span></div>' +
            '<div style="display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid #e3cbbd;border-radius:3px;padding:12px;">' +
              '<span class="cap" style="color:#a8512c;">Non-store</span>' +
              '<span class="td">Product &amp; App Portfolio</span><span class="td">Channel Performance</span><span class="td">Segments, Plans &amp; Cohorts</span><span class="td">Journey Stage Analysis</span>' +
              '<div style="height:1px;background:#f0e6e0;"></div><span class="foot">Store pages hidden, not merely empty</span></div>' +
          '</div>' +
          '<span class="foot">Common to both: Overview · Reviews Feed · Insights · Source Coverage · Actions · Reports</span>' +
        '</div>' +
        '<div class="pnl" style="padding:15px 16px;display:flex;flex-direction:column;gap:10px;">' +
          '<span class="h">Try both</span>' +
          '<span class="td">Sign in as Titan, then sign out and return as Northline. The shell, the routes and the component library are identical — only the resolved config differs.</span>' +
        '</div>' +
      '</div>';
  }

  function userEmail() { return "cx.lead@example.com"; }

  function resolvedPanel(picked) {
    if (!picked) {
      return '<div class="pnl" style="padding:22px 16px;display:flex;flex-direction:column;gap:8px;">' +
        '<span class="cap">Resolved tenant</span>' +
        '<span class="td" style="color:#6f7278;">Select a workspace to see the configuration it resolves.</span></div>';
    }
    var t = TENANTS[picked];
    var storeBased = t.type === "STORE_BASED";
    var pairs = [
      ["Branding", "Logo, wordmark, palette, favicon, report cover"],
      ["Entity model", storeBased ? "Brand → Region → City → Store → Counter" : "Brand → Product line → Product → Release / Plan"],
      ["Sources", storeBased ? "11 connectors, 7 live, 4 pending credentials" : "9 connectors, 6 live, 3 pending credentials"],
      ["Taxonomy", "15 universal themes + " + (storeBased ? "6" : "4") + " tenant-specific"],
      ["Dashboard config", t.groups.reduce(function (n, g) { return n + g.items.length; }, 0) + " pages, default filters, KPI targets"],
      ["Permissions", storeBased ? "Role, region scope, PII visibility, export rights" : "Role, product scope, PII visibility, export rights"]
    ];
    return '<div class="pnl" style="padding:15px 16px;display:flex;flex-direction:column;gap:12px;">' +
      '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;"><span class="cap">Resolved tenant</span>' +
      '<span style="font:600 12.5px/1 \'IBM Plex Sans\',sans-serif;color:#17181a;">' + esc(picked) + '</span>' +
      '<span class="tag tag-c" style="margin-left:auto;">company_type = ' + esc(t.type) + '</span></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px;">' +
      pairs.map(function (p) {
        return '<div style="display:flex;flex-direction:column;gap:4px;border-left:2px solid #dcdde0;padding-left:10px;">' +
          '<span class="cap">' + esc(p[0]) + '</span><span class="td">' + esc(p[1]) + '</span></div>';
      }).join("") + '</div></div>';
  }

  el.login.addEventListener("click", function (e) {
    var pick = e.target.closest("[data-pick]");
    if (pick) { state.pending = pick.getAttribute("data-pick"); renderLogin(); return; }
    if (e.target.closest("[data-signin],[data-sso]")) {
      if (!state.pending) return;
      signIn(state.pending);
    }
  });

  function signIn(key) {
    var t = TENANTS[key];
    location.hash = "#/" + key + "/" + t.groups[0].items[0][0];
  }

  /* ============ app shell ============ */
  function renderShell() {
    var t = TENANTS[state.tenant];
    el.app.innerHTML =
      '<aside id="side">' +
        '<div style="padding:16px 14px 13px;border-bottom:1px solid #ececed;display:flex;flex-direction:column;gap:11px;">' +
          '<div style="display:flex;align-items:center;gap:10px;">' +
            '<div style="width:34px;height:34px;flex:none;border:1px solid #dcdde0;border-radius:3px;background:#f2f2f3;display:grid;place-items:center;"><span class="cap">' + esc(t.initials) + '</span></div>' +
            '<div style="display:flex;flex-direction:column;gap:4px;min-width:0;">' +
              '<div style="font:600 13.5px/1.2 \'IBM Plex Sans\',sans-serif;color:#17181a;">' + esc(t.name) + '</div>' +
              '<span class="cap">' + esc(t.typeLabel) + '</span></div></div>' +
          '<div style="display:flex;align-items:flex-start;gap:7px;border:1px dashed #e3cbbd;background:#f7ede7;border-radius:3px;padding:7px 8px;">' +
            '<span class="tag tag-c">Fixed</span>' +
            '<span style="font:400 10px/1.4 \'IBM Plex Sans\',sans-serif;color:#a8512c;">Tenant set at login. No switcher in-app.</span></div>' +
        '</div>' +
        '<nav id="nav" style="display:flex;flex-direction:column;gap:2px;padding:11px 10px;">' +
          t.groups.map(function (g) {
            return '<div class="cap" style="padding:14px 8px 6px;display:flex;align-items:center;gap:6px;">' + esc(g.label) +
              (g.flag ? ' <span class="tag tag-c">' + esc(g.flag) + '</span>' : "") + '</div>' +
              g.items.map(function (it) {
                return '<button type="button" class="nav" data-go="' + it[0] + '" style="display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:3px;color:#4b4d52;">' +
                  '<span class="ico"></span>' + esc(it[1]) + '</button>';
              }).join("");
          }).join("") +
        '</nav>' +
        '<div style="margin-top:auto;padding:12px 14px;border-top:1px solid #ececed;display:flex;align-items:center;gap:9px;">' +
          '<div style="width:26px;height:26px;flex:none;border-radius:50%;background:#f2f2f3;border:1px solid #dcdde0;"></div>' +
          '<div style="display:flex;flex-direction:column;gap:4px;min-width:0;">' +
            '<span style="font:500 11.5px/1 \'IBM Plex Sans\',sans-serif;color:#17181a;">' + esc(t.user) + '</span>' +
            '<span class="cap">' + esc(t.role) + '</span></div>' +
          '<button type="button" class="btn" data-signout="1" style="margin-left:auto;padding:6px 9px;">Sign out</button>' +
        '</div>' +
      '</aside>' +
      '<div id="main">' +
        '<header id="head">' +
          '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
            '<button type="button" id="burger" class="btn" style="padding:6px 9px;" aria-label="Toggle navigation">Menu</button>' +
            '<div class="crumb"><span>' + esc(t.name) + '</span><span>/</span><b id="crumb-page"></b><span id="crumb-flag"></span></div>' +
          '</div>' +
          '<div id="head-actions" style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;"></div>' +
        '</header>' +
        '<div id="scroll"><div id="view"></div></div>' +
      '</div>';
  }

  function renderPage() {
    var t = TENANTS[state.tenant], page = state.page;
    var view = document.getElementById("view");
    var crumb = document.getElementById("crumb-page");
    var flag = document.getElementById("crumb-flag");
    var acts = document.getElementById("head-actions");

    crumb.textContent = TITLES[page] || page;
    flag.innerHTML = STORE_ONLY[page] ? '<span class="tag tag-c" style="margin-left:6px;">Store-based tenants only</span>'
      : (page === "ns-products" ? '<span class="tag tag-c" style="margin-left:6px;">Primary entity page</span>' : "");

    var a = ACTIONS[page] || ["Save view", "Export"];
    acts.innerHTML =
      '<div class="chip" data-nofilter="1"><span style="width:6px;height:6px;border-radius:50%;background:#17181a;"></span>Data fresh · 14 Sep, 06:00 IST</div>' +
      '<button type="button" class="btn">' + esc(a[0]) + '</button>' +
      '<button type="button" class="btn btn-p">' + esc(a[1]) + '</button>';

    view.setAttribute("data-page", page);

    /* Availability: a page outside this tenant's page set is a 404, not an
       empty state — that is the framework rule, made visible. */
    var allowed = {};
    t.groups.forEach(function (g) { g.items.forEach(function (it) { allowed[it[0]] = 1; }); });
    if (!allowed[page]) {
      view.innerHTML = notAvailable(page, t);
      document.getElementById("scroll").scrollTop = 0;
      return;
    }

    var html = window.PAGE_HTML[page];
    if (!html) { view.innerHTML = notWireframed(page); document.getElementById("scroll").scrollTop = 0; return; }

    view.innerHTML = hintHtml() + html;
    markNav();
    enhance(view);
    document.getElementById("scroll").scrollTop = 0;
  }

  function notAvailable(page, t) {
    var why = STORE_ONLY[page]
      ? TITLES[page] + " analyses stores, branches and geography. " + t.name + " is registered as a non-store company, so the page is not part of its page set."
      : TITLES[page] + " belongs to the non-store page set. " + t.name + " is a store-based company and uses the Network pages instead.";
    return '<div class="empty"><span class="cap">404 · route not in this tenant\'s page set</span>' +
      '<h2>' + esc(TITLES[page] || page) + ' is not available here</h2>' +
      '<p>' + esc(why) + '</p>' +
      '<p style="color:#6f7278;">The route returns 404 rather than rendering an empty page. Showing it blank would invite the question "why is our store data missing" for a company that has no stores.</p>' +
      '<button type="button" class="btn btn-p" data-go="' + esc(t.groups[0].items[0][0]) + '">Back to Overview</button></div>';
  }

  function notWireframed(page) {
    return '<div class="empty"><span class="cap">Not wireframed yet</span>' +
      '<h2>' + esc(TITLES[page] || page) + '</h2>' +
      '<p>This page is in the tenant\'s page set and routes correctly, but it has not been wireframed in this round. It would follow the same shell: filter bar, KPI row, one or two analytical modules, and an evidence drilldown into the Reviews Feed.</p>' +
      '<button type="button" class="btn" data-go="reviews">Go to Reviews Feed</button></div>';
  }

  function hintHtml() {
    if (store("cxm-hint-dismissed") === "1") return "";
    return '<div id="hint"><p><strong>Prototype.</strong> Navigation, tabs, filter chips, review facets, column sorting and drilldowns are live. ' +
      'Figures are illustrative sample values, not measurements — only the Reviews Feed filters operate on real rows.</p>' +
      '<button type="button" data-dismiss-hint="1">Got it</button></div>';
  }

  function markNav() {
    var btns = el.app.querySelectorAll("#nav .nav");
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute("data-go") === state.page;
      btns[i].classList.toggle("nav-on", on);
      if (on) btns[i].setAttribute("aria-current", "page"); else btns[i].removeAttribute("aria-current");
    }
  }

  /* ============ making the wireframe markup interactive ============ */
  function enhance(root) {
    /* Sortable column headers: a header row's .th cells map by index onto the
       sibling data rows, which share the same grid template. */
    var heads = root.querySelectorAll(".th");
    for (var i = 0; i < heads.length; i++) {
      var th = heads[i], parent = th.parentElement;
      if (!parent || parent.children.length < 2) continue;
      if (rowsFor(parent).length < 2) continue;
      th.setAttribute("data-sortable", "1");
      th.setAttribute("tabindex", "0");
      th.setAttribute("role", "button");
    }

    /* Data rows in a league table drill through to the evidence. */
    var allHeads = root.querySelectorAll('.th[data-sortable]');
    for (var j = 0; j < allHeads.length; j++) {
      var rows = rowsFor(allHeads[j].parentElement);
      for (var k = 0; k < rows.length; k++) {
        if (rows[k].getAttribute("data-drill")) continue;
        rows[k].setAttribute("data-drill", "reviews");
        rows[k].classList.add("drill");
        rows[k].setAttribute("tabindex", "0");
      }
    }

    /* Links in the wireframe copy become real routes. */
    var links = root.querySelectorAll("a");
    for (var m = 0; m < links.length; m++) {
      var txt = links[m].textContent || "";
      for (var n = 0; n < LINK_ROUTES.length; n++) {
        if (LINK_ROUTES[n][0].test(txt)) { links[m].setAttribute("data-go", LINK_ROUTES[n][1]); break; }
      }
      links[m].setAttribute("href", "#");
    }

    /* Review cards get attributes read off their own chips, so the facets can
       filter real rows rather than pretending to. */
    /* The feed's facets arrive pre-selected in the wireframe, so apply them
       once on load — the controls and the visible rows must agree. */
    if (state.page === "reviews") { indexReviews(root); applyReviewFilters(root); }
    if (state.page === "insights") indexInsights(root);
  }

  /* Data rows that follow a header: either the header's later siblings, or the
     children of the flex-column container that comes after it. Rows share the
     header's grid template, so an equal child count is what identifies them —
     that keeps footers and legends out of the sort. */
  function rowsFor(head) {
    var cols = head.children.length, out = [], sib = head.nextElementSibling;
    if (sib && !sib.querySelector(".th") && sib.children.length &&
        sib.children[0].children.length === cols) {
      for (var i = 0; i < sib.children.length; i++) {
        if (sib.children[i].children.length === cols) out.push(sib.children[i]);
      }
      if (out.length > 1) return out;
      out = [];
    }
    while (sib) {
      if (sib.children.length === cols && !sib.querySelector(".th")) out.push(sib);
      sib = sib.nextElementSibling;
    }
    return out;
  }

  function cellText(row, idx) {
    var c = row.children[idx];
    return c ? (c.textContent || "").trim() : "";
  }

  function sortBy(th) {
    var head = th.parentElement, idx = Array.prototype.indexOf.call(head.children, th);
    var rows = rowsFor(head);
    if (rows.length < 2) return;
    var dir = th.getAttribute("data-dir") === "asc" ? "desc" : "asc";
    var sibs = head.parentElement;
    for (var i = 0; i < head.children.length; i++) head.children[i].removeAttribute("data-dir");
    th.setAttribute("data-dir", dir);

    var parsed = rows.map(function (r) {
      var t = cellText(r, idx);
      var num = parseFloat(t.replace(/[^0-9.\-−]/g, "").replace("−", "-"));
      return { row: r, t: t, n: isNaN(num) ? null : num };
    });
    parsed.sort(function (a, b) {
      if (a.n !== null && b.n !== null) return dir === "asc" ? a.n - b.n : b.n - a.n;
      return dir === "asc" ? a.t.localeCompare(b.t) : b.t.localeCompare(a.t);
    });
    var container = rows[0].parentElement;
    parsed.forEach(function (p) { container.appendChild(p.row); });
    toast("Sorted by " + (th.textContent || "column").replace(/⇅/g, "").trim() + " · " + dir);
  }

  /* ---- Reviews Feed: real filtering over the sample rows ---- */
  var reviewCards = [];
  function indexReviews(root) {
    reviewCards = [];
    /* The star pills in the facet rail are plain tags in the markup; give them
       a value the filter can read. */
    var tags = root.querySelectorAll(".tag");
    for (var t = 0; t < tags.length; t++) {
      var sm = /^([1-5])★$/.exec((tags[t].textContent || "").trim());
      if (sm) {
        tags[t].setAttribute("data-star", sm[1]);
        tags[t].setAttribute("role", "button");
        tags[t].setAttribute("tabindex", "0");
      }
    }
    var pnls = root.querySelectorAll(".pnl");
    for (var i = 0; i < pnls.length; i++) {
      var p = pnls[i];
      if (!p.querySelector(".quote")) continue;
      var cardTags = p.querySelectorAll(".tag");
      var texts = [];
      for (var j = 0; j < cardTags.length; j++) texts.push((cardTags[j].textContent || "").trim());
      var ratingEl = p.querySelector(".tdk");
      var ratingTxt = ratingEl ? (ratingEl.textContent || "") : "";
      var stars = /(\d)★/.exec(ratingTxt);
      reviewCards.push({
        node: p,
        source: (texts[0] || "").toLowerCase(),
        rating: stars ? parseInt(stars[1], 10) : null,
        text: (p.textContent || "").toLowerCase()
      });
    }
  }

  function applyReviewFilters(root) {
    var boxes = root.querySelectorAll(".facet");
    var wanted = { source: [], sentiment: [], theme: [] };
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      if (!b.querySelector(".box-on")) continue;
      var label = (b.firstElementChild ? b.firstElementChild.textContent : "").trim().toLowerCase();
      var group = groupOf(b);
      if (wanted[group]) wanted[group].push(label);
    }
    var stars = [];
    var starTags = root.querySelectorAll('[data-star]');
    for (var s = 0; s < starTags.length; s++) {
      if (starTags[s].classList.contains("tag-k")) stars.push(parseInt(starTags[s].getAttribute("data-star"), 10));
    }

    var shown = 0;
    reviewCards.forEach(function (c) {
      var ok = true;
      if (wanted.source.length) ok = ok && wanted.source.some(function (w) { return c.source.indexOf(w.split(" ")[0]) >= 0; });
      if (ok && stars.length) ok = c.rating !== null && stars.indexOf(c.rating) >= 0;
      if (ok && wanted.sentiment.length) {
        ok = wanted.sentiment.some(function (w) {
          if (c.rating === null) return w === "neutral";
          if (w === "positive") return c.rating >= 4;
          if (w === "negative") return c.rating <= 2;
          return c.rating === 3;
        });
      }
      if (ok && wanted.theme.length) ok = wanted.theme.some(function (w) { return c.text.indexOf(w.split(" ")[0]) >= 0; });
      c.node.classList.toggle("hidden", !ok);
      if (ok) shown++;
    });

    var count = root.querySelector('[data-review-count]');
    if (!count) {
      var foots = root.querySelectorAll(".foot");
      for (var f = 0; f < foots.length; f++) {
        if (/records · page/.test(foots[f].textContent || "")) { count = foots[f]; count.setAttribute("data-review-count", "1"); break; }
      }
    }
    if (count) count.textContent = "Showing " + shown + " of " + reviewCards.length + " sample records";
  }

  function groupOf(facet) {
    var n = facet.previousElementSibling;
    while (n) {
      if (n.classList && n.classList.contains("cap")) {
        var t = (n.textContent || "").toLowerCase();
        if (t.indexOf("source") >= 0) return "source";
        if (t.indexOf("sentiment") >= 0) return "sentiment";
        if (t.indexOf("theme") >= 0) return "theme";
        return "other";
      }
      n = n.previousElementSibling;
    }
    return "other";
  }

  /* ---- Insights: tabs really filter the list ---- */
  var insightCards = [];
  function indexInsights(root) {
    insightCards = [];
    var pnls = root.querySelectorAll(".pnl");
    for (var i = 0; i < pnls.length; i++) {
      var p = pnls[i];
      if (!/INS-\d/.test(p.textContent || "")) continue;
      if (p.querySelector("h2")) continue; /* detail pane, not a list card */
      insightCards.push({ node: p, text: (p.textContent || "").toLowerCase() });
    }
  }

  function applyInsightTab(root, label) {
    var key = label.toLowerCase().replace(/\s*\(\d+\)/, "").trim();
    var shown = 0;
    insightCards.forEach(function (c) {
      var ok = key === "all" || c.text.indexOf(key) >= 0;
      c.node.classList.toggle("hidden", !ok);
      if (ok) shown++;
    });
    toast(shown + " insight" + (shown === 1 ? "" : "s") + " in " + label.replace(/\s*\(\d+\)/, ""));
  }

  /* ============ delegated events ============ */
  el.app.addEventListener("click", function (e) {
    var view = document.getElementById("view");

    var go = e.target.closest("[data-go]");
    if (go) {
      e.preventDefault();
      navigate(go.getAttribute("data-go"));
      return;
    }
    if (e.target.closest("[data-signout]")) { location.hash = "#/login"; return; }
    if (e.target.closest("#burger")) { document.getElementById("side").classList.toggle("open"); return; }
    if (e.target.closest("[data-dismiss-hint]")) {
      store("cxm-hint-dismissed", "1");
      var h = document.getElementById("hint"); if (h) h.remove();
      return;
    }

    var th = e.target.closest(".th[data-sortable]");
    if (th) { sortBy(th); return; }

    var tab = e.target.closest(".tab");
    if (tab) {
      var sibs = tab.parentElement.querySelectorAll(".tab");
      for (var i = 0; i < sibs.length; i++) sibs[i].classList.remove("tab-on");
      tab.classList.add("tab-on");
      if (state.page === "insights") applyInsightTab(view, tab.textContent || "");
      return;
    }

    var facet = e.target.closest(".facet");
    if (facet) {
      var box = facet.querySelector(".box");
      if (box) box.classList.toggle("box-on");
      if (state.page === "reviews") applyReviewFilters(view);
      return;
    }

    var star = e.target.closest("[data-star]");
    if (star) {
      star.classList.toggle("tag-k");
      if (state.page === "reviews") applyReviewFilters(view);
      return;
    }

    var chip = e.target.closest(".chip");
    if (chip && !chip.hasAttribute("data-nofilter")) {
      chip.classList.toggle("chip-on");
      return;
    }

    var drill = e.target.closest("[data-drill]");
    if (drill) { navigate(drill.getAttribute("data-drill")); return; }

    var btn = e.target.closest(".btn, .bigbtn");
    if (btn) {
      var label = (btn.textContent || "").trim();
      if (/^reset$/i.test(label)) { resetFilters(view); return; }
      if (/columns/i.test(label)) { toast("Column picker — not built in this prototype"); return; }
      toast(label + " — prototype action, nothing is sent");
      return;
    }
  });

  el.app.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = e.target;
    if (t.matches && (t.matches(".th[data-sortable]") || t.matches("[data-drill]"))) {
      e.preventDefault();
      t.click();
    }
  });

  function resetFilters(view) {
    var on = view.querySelectorAll(".chip-on");
    for (var i = 0; i < on.length; i++) on[i].classList.remove("chip-on");
    if (state.page === "reviews") {
      var boxes = view.querySelectorAll(".facet .box-on");
      for (var j = 0; j < boxes.length; j++) boxes[j].classList.remove("box-on");
      var stars = view.querySelectorAll("[data-star]");
      for (var k = 0; k < stars.length; k++) stars[k].classList.remove("tag-k");
      applyReviewFilters(view);
    }
    toast("Filters reset");
  }

  function navigate(page) {
    if (!page) return;
    document.getElementById("side").classList.remove("open");
    location.hash = "#/" + state.tenant + "/" + page;
  }

  /* ============ router ============ */
  function route() {
    var parts = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);

    if (!parts.length || parts[0] === "login" || !TENANTS[parts[0]]) {
      state.tenant = null; state.page = null;
      el.app.classList.add("hidden");
      el.login.classList.remove("hidden");
      renderLogin();
      document.title = "Review Intelligence Console";
      return;
    }

    var tenantChanged = state.tenant !== parts[0];
    state.tenant = parts[0];
    state.page = parts[1] || TENANTS[state.tenant].groups[0].items[0][0];

    el.login.classList.add("hidden");
    el.app.classList.remove("hidden");
    if (tenantChanged || !document.getElementById("nav")) renderShell();
    renderPage();
    document.title = (TITLES[state.page] || "Console") + " · " + TENANTS[state.tenant].name;
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
